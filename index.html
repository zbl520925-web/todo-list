<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <meta name="description" content="A clean and responsive todo list app with local storage." />
  <style>
    :root {
      --bg: #f5f7fb;
      --card: rgba(255, 255, 255, 0.92);
      --text: #172033;
      --muted: #7b8498;
      --primary: #5b67f1;
      --primary-dark: #4854dc;
      --line: #e8ebf2;
      --danger: #ef476f;
      --success: #2fbf71;
      --shadow: 0 24px 60px rgba(37, 45, 72, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(91, 103, 241, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(47, 191, 113, 0.12), transparent 30%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .app {
      width: min(100%, 720px);
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      padding: 34px 34px 20px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .composer {
      display: flex;
      gap: 12px;
      padding: 12px 34px 24px;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 15px 17px;
      font-size: 15px;
      outline: none;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer .date-input {
      flex: 0 0 170px;
      color: var(--text);
    }

    .composer input:focus {
      border-color: rgba(91, 103, 241, 0.55);
      box-shadow: 0 0 0 4px rgba(91, 103, 241, 0.1);
    }

    button {
      font: inherit;
    }

    .add-btn {
      border: 0;
      border-radius: 16px;
      padding: 0 20px;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .add-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 0 34px 18px;
      border-bottom: 1px solid var(--line);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn,
    .clear-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 11px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .filter-btn.active {
      color: var(--primary);
      background: rgba(91, 103, 241, 0.1);
    }

    .clear-btn:hover {
      color: var(--danger);
      background: rgba(239, 71, 111, 0.08);
    }

    .list-wrap {
      padding: 18px 20px 8px;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 14px;
      border: 1px solid transparent;
      border-radius: 16px;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .todo-item:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: var(--line);
      transform: translateY(-1px);
    }

    .check {
      appearance: none;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border-radius: 50%;
      border: 2px solid #cbd1df;
      background: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .check:checked {
      border-color: var(--success);
      background: var(--success);
    }

    .check:checked::after {
      content: "✓";
      color: white;
      font-size: 14px;
      line-height: 1;
      font-weight: 900;
    }

    .todo-text {
      min-width: 0;
      font-size: 15px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .todo-content {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .due-date {
      width: fit-content;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .due-date.today {
      color: #b7791f;
    }

    .due-date.overdue {
      color: var(--danger);
    }

    .todo-item.completed .todo-text {
      color: #a0a7b6;
      text-decoration: line-through;
    }

    .delete-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #a1a8b7;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 71, 111, 0.08);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 16px 52px;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(91, 103, 241, 0.1);
      color: var(--primary);
      font-size: 24px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 34px 28px;
      color: var(--muted);
      font-size: 13px;
    }

    .count strong {
      color: var(--text);
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .app {
        border-radius: 22px;
      }

      .header,
      .composer,
      .toolbar,
      .footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      .composer {
        flex-direction: column;
      }

      .composer .date-input {
        flex-basis: auto;
        width: 100%;
      }

      .add-btn {
        min-height: 48px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <p class="eyebrow">Stay focused</p>
      <h1>Todo List</h1>
      <p class="subtitle">把今天要做的事，一件一件完成。</p>
    </section>

    <form class="composer" id="todoForm">
      <input
        id="todoInput"
        type="text"
        maxlength="120"
        placeholder="输入一个新任务…"
        autocomplete="off"
        aria-label="新任务"
      />
      <input
        class="date-input"
        id="dueDateInput"
        type="date"
        aria-label="截至日期"
        title="截至日期（可选）"
      />
      <button class="add-btn" type="submit">添加任务</button>
    </form>

    <section class="toolbar">
      <div class="filters" aria-label="任务筛选">
        <button class="filter-btn active" type="button" data-filter="all">全部</button>
        <button class="filter-btn" type="button" data-filter="active">待完成</button>
        <button class="filter-btn" type="button" data-filter="completed">已完成</button>
      </div>
      <button class="clear-btn" id="clearCompleted" type="button">清除已完成</button>
    </section>

    <section class="list-wrap">
      <ul class="todo-list" id="todoList"></ul>
      <div class="empty" id="emptyState" hidden>
        <div class="empty-icon">✓</div>
        <div id="emptyText">还没有任务，添加一个吧。</div>
      </div>
    </section>

    <footer class="footer">
      <div class="count"><strong id="remainingCount">0</strong> 项待完成</div>
      <div>数据仅保存在当前浏览器</div>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "todo-list-v1";

    const form = document.getElementById("todoForm");
    const input = document.getElementById("todoInput");
    const dueDateInput = document.getElementById("dueDateInput");
    const list = document.getElementById("todoList");
    const emptyState = document.getElementById("emptyState");
    const emptyText = document.getElementById("emptyText");
    const remainingCount = document.getElementById("remainingCount");
    const clearCompleted = document.getElementById("clearCompleted");
    const filterButtons = [...document.querySelectorAll(".filter-btn")];

    let todos = loadTodos();
    let currentFilter = "all";

    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function makeId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function addTodo(text, dueDate) {
      todos.unshift({
        id: makeId(),
        text,
        completed: false,
        dueDate,
        createdAt: Date.now()
      });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map(todo =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      render();
    }

    function getVisibleTodos() {
      if (currentFilter === "active") return todos.filter(todo => !todo.completed);
      if (currentFilter === "completed") return todos.filter(todo => todo.completed);
      return todos;
    }

    function getTodayKey() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDueDate(dateKey, completed) {
      if (!dateKey) return null;

      const [year, month, day] = dateKey.split("-").map(Number);
      const label = new Intl.DateTimeFormat("zh-CN", {
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(new Date(year, month - 1, day));
      const today = getTodayKey();

      if (!completed && dateKey < today) {
        return { text: `已逾期 · ${label}`, status: "overdue" };
      }
      if (!completed && dateKey === today) {
        return { text: `今天到期 · ${label}`, status: "today" };
      }
      return { text: `截至 ${label}`, status: "" };
    }

    function render() {
      list.innerHTML = "";
      const visibleTodos = getVisibleTodos();

      visibleTodos.forEach(todo => {
        const item = document.createElement("li");
        item.className = `todo-item${todo.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "check";
        checkbox.checked = todo.completed;
        checkbox.setAttribute("aria-label", `标记任务：${todo.text}`);
        checkbox.addEventListener("change", () => toggleTodo(todo.id));

        const content = document.createElement("div");
        content.className = "todo-content";

        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = todo.text;
        content.appendChild(text);

        const due = formatDueDate(todo.dueDate, todo.completed);
        if (due) {
          const dueLabel = document.createElement("span");
          dueLabel.className = `due-date${due.status ? ` ${due.status}` : ""}`;
          dueLabel.textContent = due.text;
          content.appendChild(dueLabel);
        }

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.innerHTML = "&times;";
        deleteButton.setAttribute("aria-label", `删除任务：${todo.text}`);
        deleteButton.addEventListener("click", () => deleteTodo(todo.id));

        item.append(checkbox, content, deleteButton);
        list.appendChild(item);
      });

      const remaining = todos.filter(todo => !todo.completed).length;
      remainingCount.textContent = remaining;

      emptyState.hidden = visibleTodos.length !== 0;
      if (visibleTodos.length === 0) {
        if (currentFilter === "active" && todos.length) {
          emptyText.textContent = "太棒了，当前没有待完成任务。";
        } else if (currentFilter === "completed") {
          emptyText.textContent = "还没有已完成的任务。";
        } else {
          emptyText.textContent = "还没有任务，添加一个吧。";
        }
      }

      filterButtons.forEach(button => {
        button.classList.toggle("active", button.dataset.filter === currentFilter);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) {
        input.focus();
        return;
      }

      addTodo(value, dueDateInput.value);
      input.value = "";
      dueDateInput.value = "";
      input.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        render();
      });
    });

    clearCompleted.addEventListener("click", () => {
      todos = todos.filter(todo => !todo.completed);
      saveTodos();
      render();
    });

    render();
  </script>
</body>
</html>
